<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .wrap-1{
            width: 100%;
            height: 100vh;
            /*transistions color with a straight
             line we can also control the direction of this first direction must be mentioned
             to right, to left,to top,to bottom,to left top,to right bottom
             to right top,to left bottom can also give degree of rotation on the place of the 
             direction example(90deg,120deg,111deg,333deg */
            background: linear-gradient(to right bottom, red,green,blue,yellow);
        }
        .wrap-2{
            width: 100%;
            height: 100vh;
            /* starts from single point define by its center or circular or elliptical form
            can give shape (ellipse,circle) and colors
            • ellipse (Default). The gradient stretches to match the aspect ratio of the HTML element. A rectangular box produces an oval gradient.
            • circle. The gradient maintains a uniform radius in all directions, creating a true circle regardless of the container's dimensions. */
            background: radial-gradient(circle,green,teal,red,yellow,orange,purple,silver);
        }
    </style>
</head>
<body align="center">
    <div class="wrap-1"></div>
    <div class="wrap-2"></div>
</body>
</html>
