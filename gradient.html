<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .wrap-1{
            width: 100%;
            height: 100vh;
            /*transistions color with a straight
             line we can also control the direction of this first direction must be mentioned
             to right, to left,to top,to bottom,to left top,to right bottom
             to right top,to left bottom */
            background: linear-gradient(to left bottom, red,green,blue,yellow);
        }
        .wrap-2{
            width: 100%;
            height: 100vh;
            /* starts from single point define by its center or circular or elliptical form */
            background: radial-gradient(skyblue,green,teal);
        }
    </style>
</head>
<body align="center">
    <div class="wrap-1"></div>
    <div class="wrap-2"></div>
</body>
</html>
