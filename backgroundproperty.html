<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            background-color:aqua;
        }
        div{
            margin-top: 5px;
            margin-left: 480px;
            width: 50.5%;
            height: 97.1vh;
            border: 10px solid brown;
            /* backgorund image uses url attribute to insert the image */
            background-image: url(https://images.unsplash.com/photo-1785061972219-f2e44c227080?q=80&w=1517&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);
            background-size: cover;/*contain,auto,percentage */
            background-repeat: no-repeat;/*Repeat */
            background-position: center;/* decides position of the*/
            background-attachment: scroll;/*fixed*/

            border-radius: 50% ;
        }
        
    </style>
</head>
<body>
    <div></div>
</body>
</html>
