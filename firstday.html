<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="external.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- style can be inside the head internal css -->
    <style>
        /* this is internal css */
        h3{
            font-size: 70px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: teal;
            background-color: black;
        }
    </style>
</head>
<body>
    <!-- Inline css example -->
    <h1 style="font-size: 80px; font-style: italic; background-color: yellow;">This is inline CSS</h1>

    <!-- External CSS -->
    <h2>This is External CSS</h2>

    <!-- Internal CSS -->
    <h3>This is Internal CSS</h3>
</body>
</html>
